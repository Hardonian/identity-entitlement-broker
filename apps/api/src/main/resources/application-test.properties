# =============================================================================
# Identity Entitlement Broker API - Test Configuration
# =============================================================================

# === Server ===
quarkus.http.port=0
quarkus.http.test-port=0

# === Datasource - H2 for fast tests ===
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:identitybroker;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%test.quarkus.datasource.jdbc.min-size=2
%test.quarkus.datasource.jdbc.max-size=10

# === Hibernate for tests ===
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.log.sql=false
%test.quarkus.hibernate-orm.log.bind-parameters=false

# === Dev Auth - Enabled for tests ===
%test.dev.auth.enabled=true
%test.dev.auth.default-tenant-id=00000000-0000-0000-0000-000000000001
%test.dev.auth.default-actor-id=test-admin

# === OIDC - Disabled for tests (using dev auth) ===
%test.quarkus.oidc.enabled=false
%test.quarkus.oidc.auth-server-url=none
%test.quarkus.oidc.client-id=none

# === OPA - Test connection (won't be used if fallback engine is tested) ===
%test.opa.url=http://localhost:9999/v1/data
%test.opa.timeout=1s

# === Logging for tests ===
%test.quarkus.log.level=WARN
%test.quarkus.log.min-level=WARN
%test.quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{1.}] %s%e%n
%test.quarkus.log.console.color=false

# === Test Resources ===
%test.quarkus.test.native-image-profile=false

# === Test Containers (alternative - use instead of H2 for MariaDB tests via TC) ===
# Uncomment below to use Testcontainers MariaDB instead of H2:
# %test.quarkus.datasource.db-kind=mariadb
# %test.quarkus.datasource.username=test
# %test.quarkus.datasource.password=test
