# Application
quarkus.application.name=identity-entitlement-broker
quarkus.application.version=1.0.0

# HTTP
quarkus.http.port=8080

# Database (H2 for dev/test)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:identitybroker;DB_CLOSE_DELAY=-1
quarkus.datasource.jdbc.driver=org.h2.Driver

# JPA / Hibernate
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-scripts=import.sql

# Jackson
quarkus.jackson.serialization-inclusion=non-empty

# SmallRye OpenAPI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.enable=true
mp.openapi.extensions.smallrye.info.title=Identity Entitlement Broker API
mp.openapi.extensions.smallrye.info.version=1.0.0

# Dev auth (for testing)
quarkus.http.auth.proactive=false
quarkus.http.permissions.default.permit-all=true

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,x-tenant-id,x-actor-id
