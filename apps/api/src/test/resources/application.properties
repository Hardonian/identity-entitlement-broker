# Test profile: H2 + dev auth enabled
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:identitybroker-test;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# Dev auth enabled for tests
quarkus.http.auth.proactive=false
quarkus.http.permissions.default.permit-all=true

# Jackson
quarkus.jackson.serialization-inclusion=non-empty

# OpenAPI
quarkus.swagger-ui.always-include=false
mp.openapi.extensions.smallrye.info.title=Identity Entitlement Broker API (Test)
mp.openapi.extensions.smallrye.info.version=1.0.0

# Test-specific config
opa.url=
